<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Arrival Dashboard</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --dark: #0f172a;
      --light: #f1f5f9;
      --green: #15803d;
      --green-light: #dcfce7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1152px;
      margin: 0 auto;
      padding: 16px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      background: var(--light);
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 8px 0 0;
      color: #475569;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    .small-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 10px 16px;
      background: white;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .small-button.secondary { background: var(--light); }
    .tabs {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .tab {
      border-radius: 24px;
      border: 1px solid transparent;
      background: rgba(255,255,255,.75);
      padding: 16px;
      text-align: left;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .tab.active { border-color: var(--dark); background: white; }
    .tab-top { display: flex; align-items: center; justify-content: space-between; }
    .tab-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .tab-count { margin-top: 4px; font-size: 14px; color: var(--muted); }
    .tab-percent { font-size: 24px; font-weight: 900; }
    .progress { margin-top: 16px; height: 8px; overflow: hidden; border-radius: 999px; background: var(--light); }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--dark); }
    .panel {
      border-radius: 24px;
      background: white;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
      padding: 20px;
    }
    .time-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .time-card {
      margin: 0 auto;
      min-width: min(100%, 320px);
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--dark);
      color: white;
      padding: 16px 24px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
    }
    .time-label {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #cbd5e1;
    }
    .current-time {
      margin: 4px 0 0;
      font-size: 44px;
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -0.03em;
    }
    .departure-time {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 1000;
      letter-spacing: -0.02em;
    }
    .order-section {
      margin-top: 20px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 16px;
    }
    .order-title { margin: 0 0 12px; font-size: 24px; font-weight: 900; }
    .empty {
      border-radius: 16px;
      border: 1px dashed #cbd5e1;
      background: white;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .order-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 16px;
      background: var(--green);
      color: white;
      padding: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }
    .order-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .order-number {
      display: flex;
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: white;
      color: var(--green);
      font-size: 32px;
      font-weight: 1000;
    }
    .school-name { margin: 0; color: white; font-size: 28px; line-height: 1.05; font-weight: 1000; }
    .bus-info { margin: 4px 0 0; color: var(--green-light); font-size: 14px; }
    .undo-button {
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.2);
      color: white;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .save-status {
      margin: 16px auto 0;
      max-width: 520px;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: center;
      font-weight: 800;
      display: none;
    }
    .save-status.saving { display: block; background: #fef3c7; color: #92400e; }
    .save-status.saved { display: block; background: #dcfce7; color: #166534; }
    .save-status.failed { display: block; background: #fee2e2; color: #991b1b; }
    .choice-list { margin-top: 20px; display: grid; gap: 12px; }
    .bus-row {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: white;
      padding: 16px;
      text-align: left;
      color: var(--text);
    }
    .bus-row:hover { border-color: #94a3b8; }
    .bus-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .circle {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
    }
    .choice-school { margin: 0; font-size: 28px; line-height: 1.05; font-weight: 1000; }
    .choice-detail { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .bus-times { text-align: right; white-space: nowrap; }
    .depart-line { font-size: 14px; font-weight: 900; }
    .eta-line { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-weight: 400; }
    @media (min-width: 768px) {
      .container { padding: 32px; }
      header { flex-direction: row; align-items: center; justify-content: space-between; }
      .tabs { grid-template-columns: repeat(3, 1fr); }
      .time-row { flex-direction: row; align-items: flex-start; justify-content: center; }
      .current-time { font-size: 48px; }
      .school-name, .choice-school { font-size: 32px; }
    }
    @media (max-width: 560px) {
      .order-item, .bus-row { align-items: flex-start; }
      .school-name, .choice-school { font-size: 24px; }
      .bus-times { font-size: 13px; }
      .current-time { font-size: 40px; }
    }
    .mode-switch { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .mode-link { display:inline-block; padding:8px 12px; border-radius:12px; background:#e2e8f0; color:#0f172a; text-decoration:none; font-weight:800; font-size:14px; }
    .mode-link.active { background:#0f172a; color:white; }
    .sync-status { margin-top:10px; font-size:13px; font-weight:800; color:#475569; }
    body.display-mode .header-actions, body.display-mode .choice-list, body.display-mode .save-status, body.display-mode .mode-switch { display:none !important; }
    body.display-mode .container { max-width:1400px; }
    body.display-mode header { justify-content:center; text-align:center; }
    body.display-mode .subtitle { display:none; }
    body.display-mode h1 { font-size:42px; }
    body.display-mode .tabs { margin-bottom:16px; }
    body.display-mode .tab { cursor:default; }
    body.display-mode .order-title { font-size:36px; text-align:center; margin-bottom:10px; }
    body.display-mode .order-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-flow: column;
      grid-template-rows: repeat(6, auto);
      gap: 8px 14px;
    }
    body.display-mode .order-item { padding:10px 14px; min-height:72px; }
    body.display-mode .order-number { width:58px; height:58px; font-size:36px; }
    body.display-mode .school-name { font-size:32px; }
    body.display-mode .bus-info { font-size:15px; }
    body.display-mode .undo-button { display:none; }
    body.display-mode .current-time { font-size:54px; }
    body.display-mode .departure-time { font-size:30px; }
    @media (max-width: 700px) { body.display-mode .school-name { font-size:32px; } body.display-mode .order-number { width:64px; height:64px; font-size:38px; } }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <div class="badge"><span aria-hidden="true">🚌</span> Chantilly Academy Shuttle Tracker</div>
        <h1>Bus Arrival Dashboard</h1>
        <p class="subtitle" id="modeSubtitle">Tap a bus as it arrives. Updates sync to the student display.</p>
        <div class="mode-switch"><a class="mode-link" id="staffLink" href="?mode=staff">Staff Mode</a><a class="mode-link" id="displayLink" href="?mode=display">Display Mode</a></div>
        <div class="sync-status" id="syncStatus">Connecting to live display...</div>
      </div>
      <div class="header-actions">
        <button class="small-button" id="resetBlockButton">↻ Reset block</button>
        <button class="small-button secondary" id="resetAllButton">Reset all</button>
      </div>
    </header>

    <section class="tabs" id="tabs"></section>

    <section class="panel">
      <div class="time-row">
        <div class="time-card">
          <p class="time-label">Current Time</p>
          <p class="current-time" id="currentTime">--:--</p>
          <p class="time-label" style="margin-top: 12px;">Buses depart at</p>
          <p class="departure-time" id="departureTime">--:--</p>
        </div>
      </div>

      <div class="order-section">
        <h2 class="order-title" id="orderTitle">AM Shuttle Bus Order</h2>
        <div id="arrivalOrder"></div>
      </div>

      <div class="save-status" id="saveStatus" role="status" aria-live="polite"></div>
      <div class="choice-list" id="choiceList"></div>
    </section>
  </main>

  <script>
    const BLOCKS = [
      {
        id: "am",
        label: "AM",
        subtitle: "Periods 1 & 2",
        buses: [
          { school: "Centreville", bus: "3102", departs: "9:45 AM", eta: "9:57 AM", days: "All" },
          { school: "Fairfax", bus: "3100", departs: "9:45 AM", eta: "10:12 AM", days: "All" },
          { school: "Herndon #2", bus: "4101", departs: "9:45 AM", eta: "10:08 AM", days: "All" },
          { school: "Herndon #1", bus: "4108", departs: "9:45 AM", eta: "10:08 AM", days: "All" },
          { school: "Robinson", bus: "3109", departs: "9:45 AM", eta: "10:10 AM", days: "All" },
          { school: "Skyview", bus: "3107", departs: "9:45 AM", eta: "10:00 AM", days: "All" },
          { school: "South Lakes", bus: "4105", departs: "9:45 AM", eta: "10:07 AM", days: "All" },
          { school: "Westfield", bus: "3113", departs: "9:45 AM", eta: "9:58 AM", days: "All" },
          { school: "Woodson", bus: "2101", departs: "9:45 AM", eta: "10:12 AM", days: "All" }
        ]
      },
      {
        id: "mid1",
        label: "Mid Day 1",
        subtitle: "Periods 3 & 4",
        buses: [
          { school: "Centreville/ Mt. View", bus: "3205", departs: "11:15 AM", eta: "11:30 AM", days: "All" },
          { school: "Fairfax", bus: "3207", departs: "11:15 AM", eta: "11:38 AM", days: "All" },
          { school: "Falls Church", bus: "2233", departs: "11:15 AM", eta: "11:51 AM", days: "A-Day" },
          { school: "Herndon", bus: "4200", departs: "11:15 AM", eta: "11:38 AM", days: "All" },
          { school: "Madison", bus: "4203", departs: "11:15 AM", eta: "11:40 AM", days: "All" },
          { school: "Marshall/ McLean", bus: "4211", departs: "11:15 AM", eta: "11:30 AM", days: "All" },
          { school: "Oakton/ Cedar Lane", bus: "3204", departs: "11:15 AM", eta: "11:30 AM", days: "All" },
          { school: "Robinson", bus: "3215", departs: "11:15 AM", eta: "11:40 AM", days: "All" },
          { school: "South Lakes", bus: "4214", departs: "11:15 AM", eta: "11:37 AM", days: "All" },
          { school: "Westfield #1", bus: "3219", departs: "11:15 AM", eta: "11:28 AM", days: "All" },
           { school: "Westfield #2", bus: "3220", departs: "11:15 AM", eta: "11:28 AM", days: "All" },
          { school: "Woodson", bus: "2225", departs: "11:15 AM", eta: "11:40 AM", days: "All" }
        ]
      },
      {
        id: "mid2",
        label: "Mid Day 2",
        subtitle: "Periods 5 & 6",
        buses: [
          { school: "Centreville/ Mt. View", bus: "3206", departs: "1:10 PM", eta: "1:22 PM", days: "All" },
          { school: "Fairfax", bus: "3208", departs: "1:10 PM", eta: "1:33 PM", days: "All" },
          { school: "Herndon", bus: "4202", departs: "1:10 PM", eta: "1:33 PM", days: "All" },
          { school: "Madison/Oakton", bus: "4204", departs: "1:10 PM", eta: "1:36 PM", days: "All" },
          { school: "Marshall/McLean", bus: "4212", departs: "1:10 PM", eta: "1:32/ 1:50 PM", days: "All" },
          { school: "Robinson", bus: "3216", departs: "1:10 PM", eta: "1:35 PM", days: "All" },
          { school: "Skyview", bus: "3226", departs: "1:10 PM", eta: "1:20 PM", days: "All" },
          { school: "South Lakes", bus: "4215", departs: "1:10 PM", eta: "1:32 PM", days: "All" },
          { school: "Westfield", bus: "3221", departs: "1:10 PM", eta: "1:23 PM", days: "All" },
          { school: "Woodson", bus: "2250", departs: "1:10 PM", eta: "1:37 PM", days: "All" }
        ]
      }
    ];

    const STORAGE_KEY_PREFIX = "chantilly-bus-arrivals-v4";
    const TODAY_KEY = formatDate();
    const STORAGE_KEY = `${STORAGE_KEY_PREFIX}-${TODAY_KEY}`;
    const FIREBASE_DB_URL = "https://chantilly-academy-bus-tracker-default-rtdb.firebaseio.com";
    const MODE = new URLSearchParams(window.location.search).get("mode") === "display" ? "display" : "staff";

    let activeBlockId = "am";
    let arrived = loadArrived();
    let liveEventSource = null;
    let disconnectWarningTimer = null;

    function makeKey(blockId, bus) {
      return `${blockId}-${bus.school}-${bus.bus}`;
    }

    function firebaseBusKey(bus) {
      return String(bus.bus).replace(/[.#$\[\]\/]/g, "_");
    }

    function isArrived(value) {
      return Boolean(value === true || (value && value.arrived));
    }

    function getArrivalOrder(value) {
      return typeof value === "object" && value ? value.order : null;
    }

    function getArrivalTime(value) {
      return typeof value === "object" && value ? value.time : null;
    }

    function formatTime(date = new Date()) {
      return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function formatDate(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function loadArrived() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch (error) { return {}; }
    }

    function saveArrived() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arrived));
    }

    function setSaveStatus(message, type = "") {
      const el = document.getElementById("saveStatus");
      if (!el) return;
      el.textContent = message;
      el.className = `save-status ${type}`;
    }

    function setSyncStatus(message) {
      const el = document.getElementById("syncStatus");
      if (el) el.textContent = message;
    }

    async function firebaseRequest(path, options = {}) {
      const response = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
        cache: "no-store",
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (!response.ok) throw new Error(`Firebase ${response.status}`);
      return response.json();
    }

    function dayPath() { return `days/${TODAY_KEY}`; }
    function activeBlockPath() { return `${dayPath()}/activeBlockId`; }
    function arrivalsPath(blockId = "") { return `${dayPath()}/arrivals${blockId ? "/" + blockId : ""}`; }
    function busArrivalPath(block, bus) { return `${arrivalsPath(block.id)}/${firebaseBusKey(bus)}`; }

    function rebuildArrivedFromFirebase(data) {
      const next = {};
      const all = (data && data.arrivals) || {};
      BLOCKS.forEach((block) => {
        const blockData = all[block.id] || {};
        block.buses.forEach((bus) => {
          const record = blockData[firebaseBusKey(bus)];
          if (record) {
            next[makeKey(block.id, bus)] = {
              arrived: true,
              order: Number(record.order),
              time: record.time || "Recorded"
            };
          }
        });
      });
      arrived = next;
    }

    async function loadDayState() {
      const data = await firebaseRequest(dayPath());
      if (!data) {
        activeBlockId = "am";
        arrived = {};
        render();
        return false;
      }
      activeBlockId = data.activeBlockId || "am";
      rebuildArrivedFromFirebase(data);
      if (MODE === "staff") saveArrived();
      render();
      return true;
    }

    async function setSharedActiveBlock(blockId) {
      activeBlockId = blockId;
      render();
      try {
        setSyncStatus("Syncing block...");
        await firebaseRequest(activeBlockPath(), { method: "PUT", body: JSON.stringify(blockId) });
        setSyncStatus(`Live display synced at ${formatTime()}`);
      } catch (error) {
        console.error(error);
        setSyncStatus("Block sync interrupted - retrying...");
        setTimeout(() => setSharedActiveBlock(blockId), 1500);
      }
    }

    async function saveOneArrival(block, bus, record) {
      try {
        setSyncStatus("Syncing bus arrival...");
        await firebaseRequest(busArrivalPath(block, bus), {
          method: "PUT",
          body: JSON.stringify({ school: bus.school, bus: bus.bus, order: record.order, time: record.time, updatedAt: Date.now() })
        });
        setSyncStatus(`Live display synced at ${formatTime()}`);
        setSaveStatus("Live display updated.", "saved");
      } catch (error) {
        console.error(error);
        setSyncStatus("Bus sync interrupted - retrying...");
        setSaveStatus("Display update delayed. Retrying automatically.", "failed");
        setTimeout(() => saveOneArrival(block, bus, record), 1500);
      }
    }

    async function deleteOneArrival(block, bus) {
      await firebaseRequest(busArrivalPath(block, bus), { method: "DELETE" });
    }

    async function syncBlockOrders(block) {
      const payload = {};
      block.buses.forEach((bus) => {
        const value = arrived[makeKey(block.id, bus)];
        if (isArrived(value)) {
          payload[firebaseBusKey(bus)] = { school: bus.school, bus: bus.bus, order: value.order, time: value.time, updatedAt: Date.now() };
        }
      });
      await firebaseRequest(arrivalsPath(block.id), { method: "PUT", body: JSON.stringify(payload) });
    }

    async function initializeStaffDay() {
      try {
        const found = await loadDayState();
        if (!found) {
          arrived = {};
          activeBlockId = "am";
          saveArrived();
          await firebaseRequest(activeBlockPath(), { method: "PUT", body: JSON.stringify("am") });
        }
        setSyncStatus("Live display connected");
      } catch (error) {
        console.error(error);
        setSyncStatus("Could not load today's shared data.");
      }
    }

    function getActiveBlock() {
      return BLOCKS.find((block) => block.id === activeBlockId) || BLOCKS[0];
    }

    function getStats(block) {
      const total = block.buses.length;
      const count = block.buses.filter((bus) => isArrived(arrived[makeKey(block.id, bus)])).length;
      const percent = Math.round((count / total) * 100);
      return { total, count, percent };
    }

    function getNextOrder(block) {
      const orders = block.buses
        .map((bus) => getArrivalOrder(arrived[makeKey(block.id, bus)]))
        .filter((order) => typeof order === "number");
      return orders.length ? Math.max(...orders) + 1 : 1;
    }

    function resequenceBlock(block) {
      const ordered = block.buses
        .map((bus) => ({ bus, value: arrived[makeKey(block.id, bus)] }))
        .filter((item) => isArrived(item.value))
        .sort((a, b) => (getArrivalOrder(a.value) || 999) - (getArrivalOrder(b.value) || 999));

      ordered.forEach((item, index) => {
        arrived[makeKey(block.id, item.bus)] = {
          arrived: true,
          order: index + 1,
          time: getArrivalTime(item.value) || "Recorded"
        };
      });
    }

    function toggleArrival(bus) {
      const block = getActiveBlock();
      const key = makeKey(block.id, bus);
      const currentValue = arrived[key];

      if (isArrived(currentValue)) {
        delete arrived[key];
        resequenceBlock(block);
        saveArrived();
        render();
        (async () => {
          try {
            await deleteOneArrival(block, bus);
            await syncBlockOrders(block);
            setSyncStatus(`Live display synced at ${formatTime()}`);
          } catch (error) {
            console.error(error);
            setSyncStatus("Undo sync interrupted - retrying...");
            setTimeout(() => syncBlockOrders(block), 1500);
          }
        })();
        return;
      }

      const arrivalOrder = getNextOrder(block);
      const arrivalTime = formatTime();
      const record = { arrived: true, order: arrivalOrder, time: arrivalTime };
      arrived[key] = record;
      saveArrived();
      render();
      saveOneArrival(block, bus, record);
    }

    function resetBlock() {
      const block = getActiveBlock();
      if (!confirm(`Reset ${block.label}?`)) return;
      block.buses.forEach((bus) => delete arrived[makeKey(block.id, bus)]);
      saveArrived();
      render();
      firebaseRequest(arrivalsPath(block.id), { method: "DELETE" })
        .then(() => setSyncStatus(`Live display synced at ${formatTime()}`))
        .catch((error) => { console.error(error); setSyncStatus("Reset sync failed - please retry."); });
    }

    function resetAll() {
      if (!confirm("Reset all blocks?")) return;
      arrived = {};
      saveArrived();
      render();
      firebaseRequest(arrivalsPath(), { method: "DELETE" })
        .then(() => setSyncStatus(`Live display synced at ${formatTime()}`))
        .catch((error) => { console.error(error); setSyncStatus("Reset sync failed - please retry."); });
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";
      BLOCKS.forEach((block) => {
        const stats = getStats(block);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab" + (block.id === activeBlockId ? " active" : "");
        button.innerHTML = `
          <div class="tab-top">
            <div>
              <div class="tab-title">${block.label}</div>
              <div class="tab-count">${stats.count} of ${stats.total} arrived</div>
            </div>
            <div class="tab-percent">${stats.percent}%</div>
          </div>
          <div class="progress"><div class="progress-fill" style="width: ${stats.percent}%"></div></div>
        `;
        if (MODE === "staff") {
          button.addEventListener("click", () => {
            setSharedActiveBlock(block.id);
          });
        } else {
          button.disabled = true;
        }
        tabs.appendChild(button);
      });
    }

    function renderOrder(block) {
      document.getElementById("orderTitle").textContent = `${block.label} Shuttle Bus Order`;
      const arrivalOrder = document.getElementById("arrivalOrder");
      const sequence = block.buses
        .map((bus) => {
          const value = arrived[makeKey(block.id, bus)];
          return { ...bus, key: makeKey(block.id, bus), order: getArrivalOrder(value), time: getArrivalTime(value) };
        })
        .filter((bus) => bus.order !== null)
        .sort((a, b) => a.order - b.order);

      if (sequence.length === 0) {
        arrivalOrder.innerHTML = '<p class="empty">No buses have been marked arrived for this block yet.</p>';
        return;
      }

      const list = document.createElement("ol");
      list.className = "order-list";
      sequence.forEach((bus) => {
        const item = document.createElement("li");
        item.className = "order-item";
        item.innerHTML = `
          <div class="order-left">
            <span class="order-number">${bus.order}</span>
            <div>
              <p class="school-name">${bus.school}</p>
              <p class="bus-info">Bus ${bus.bus} · ${bus.time}</p>
            </div>
          </div>
          <button type="button" class="undo-button">Undo</button>
        `;
        item.querySelector("button").addEventListener("click", () => toggleArrival(bus));
        list.appendChild(item);
      });
      arrivalOrder.innerHTML = "";
      arrivalOrder.appendChild(list);
    }

    function renderChoices(block) {
      const choiceList = document.getElementById("choiceList");
      const remaining = block.buses.filter((bus) => !isArrived(arrived[makeKey(block.id, bus)]));

      choiceList.innerHTML = "";
      if (remaining.length === 0) {
        choiceList.innerHTML = '<p class="empty">All buses have been added to the arrival order.</p>';
        return;
      }

      remaining.forEach((bus) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bus-row";
        button.innerHTML = `
          <div class="bus-left">
            <span class="circle" aria-hidden="true"></span>
            <div>
              <p class="choice-school">${bus.school}</p>
              <p class="choice-detail">Bus ${bus.bus} · ${bus.days}</p>
            </div>
          </div>
          <div class="bus-times">
            <div class="depart-line">Departs ${bus.departs}</div>
            <p class="eta-line">ETA ${bus.eta}</p>
          </div>
        `;
        button.addEventListener("click", () => toggleArrival(bus));
        choiceList.appendChild(button);
      });
    }

    function render() {
      const block = getActiveBlock();
      document.getElementById("departureTime").textContent = block.buses[0] ? block.buses[0].departs : "";
      renderTabs();
      renderOrder(block);
      renderChoices(block);
    }

    function updateClock() {
      document.getElementById("currentTime").textContent = formatTime();
    }

    document.getElementById("resetBlockButton").addEventListener("click", resetBlock);
    document.getElementById("resetAllButton").addEventListener("click", resetAll);

    document.body.classList.toggle("display-mode", MODE === "display");
    document.getElementById("staffLink").classList.toggle("active", MODE === "staff");
    document.getElementById("displayLink").classList.toggle("active", MODE === "display");
    document.getElementById("modeSubtitle").textContent = MODE === "display"
      ? "Live shuttle bus order - updates automatically."
      : "Tap a bus as it arrives. Updates sync automatically to the student display.";

    updateClock();
    setInterval(updateClock, 1000);
    render();

    async function refreshDisplayFromFirebase() {
      try {
        await loadDayState();
        if (disconnectWarningTimer) { clearTimeout(disconnectWarningTimer); disconnectWarningTimer = null; }
        setSyncStatus("Live display connected");
      } catch (error) {
        console.error(error);
      }
    }

    function startRealtimeDisplay() {
      if (MODE !== "display") return;
      if (liveEventSource) liveEventSource.close();
      setSyncStatus("Connecting to live display...");
      liveEventSource = new EventSource(`${FIREBASE_DB_URL}/${dayPath()}.json`);
      const refresh = () => refreshDisplayFromFirebase();
      liveEventSource.addEventListener("put", refresh);
      liveEventSource.addEventListener("patch", refresh);
      liveEventSource.onopen = () => {
        if (disconnectWarningTimer) { clearTimeout(disconnectWarningTimer); disconnectWarningTimer = null; }
        refreshDisplayFromFirebase();
      };
      liveEventSource.onerror = () => {
        if (!disconnectWarningTimer) {
          disconnectWarningTimer = setTimeout(() => {
            setSyncStatus("Connection lost - reconnecting...");
            disconnectWarningTimer = null;
          }, 5000);
        }
      };
    }

    if (MODE === "display") {
      startRealtimeDisplay();
    } else {
      initializeStaffDay();
    }
  </script>
</body>
</html>
